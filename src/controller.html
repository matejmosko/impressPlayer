<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>impressPlayer Controller</title>
  <link rel="stylesheet" href="./css/fontawesome/all.min.css">
  <link rel="stylesheet" href="./css/styles-controller.css">
</head>
<body>
  <div id="container">
    <div id="header" class="card">
      <div id="projectorControls" class="topdiv btnRow">
        <button id="openFile" class="btn" skin="flat">
          <i class="fa fa-folder-open"></i>
        </button>
        <button id="refreshBtn" title="Refresh presentation (F5)" class="btn" skin="flat">
          <i class="fa fa-sync-alt"></i>
        </button>
        <button id="projectorBtn" title="Click to open projection window" class="btn" skin="flat">
          <i class="fa fa-desktop"></i>
        </button>
        <button id="fullscreenBtn" title="Click to make projection window fullscreen" class="btn" skin="flat">
          <i class="fa fa-arrows-alt"></i>
        </button>
        <select id="impressVersionSelect" class="btn" title="impress.js version">
          <option value="2.0.0">impress.js 2.0.0</option>
          <option value="1.1.0">impress.js 1.1.0</option>
          <option value="1.0.0">impress.js 1.0.0</option>
        </select>
        <label id="autoplayMediaLabel" class="btn quickSetting" title="Autoplay videos and audio when a media slide is entered">
          <input type="checkbox" id="autoplayMediaCheck" checked>
          <span class="btnLabel" data-i18n="Autoplay">Autoplay</span>
        </label>
      </div>
      <div style="flex:1"></div>
      <div id="mediaControlsDiv" class="hidden">
          <button id="playPauseMediaBtn" class="btn" skin="flat">
            <i class="playButton fa fa-play"></i>
            <i class="pauseButton fa fa-pause" style="display:none;"></i>
          </button>
          <input type="range" min="1" max="100" value="1" class="slider" id="audioVideoSlider">
          <button id="restartMediaBtn" class="btn" skin="flat">
            <i class="fa fa-redo"></i>
          </button>
      </div>
      <div style="flex:1"></div>
      <div id="gameControls" class="topdiv btnRow">
        <button id="nextSlideBtn" class="impressControlBtns btn">
            <i class="fa fa-step-forward"></i>
            <label id="nextSlideLabel" class="btnLabel" data-i18n="Next Slide">Next Slide</label>
        </button>
        <button id="prevSlideBtn" class="danger impressControlBtns btn">
          <i class="fa fa-step-backward"></i>
        </button>
      </div>
    </div>
    <div id="main">
      <div id="content">
        <div class="tabs">
          <button id="currentSlideTab" class="tab"><i class="fa fa-film"></i><span class="btnLabel" data-i18n="Presentation">Presentation</span></button>
          <button id="allSlidesTab" class="tab"><i class="fa fa-th-list"></i><span class="btnLabel" data-i18n="Slides List">Slides List</span></button>
        </div>
        <div id="contentCard" class="card">
          <div id="currentSlideDiv" class="content-table slidesPreview">
            <iframe id="impressCurrent" src="viewer.html"></iframe>
            <div class="impressCurtain"></div>
          </div>
          <div id="allSlidesDiv" class="content-table hidden">
            <div id="impressOverview" class="grid"></div>
          </div>
        </div>
      </div>
      <div id="sidebar">
        <div id="currentSlidePreview" class="card sidebarPreview hidden">
          <div class="nextSlideInner">
            <iframe class="thumbnailFrame" id="impressSidebarLive" src="about:blank" muted></iframe>
            <div class="impressCurtain"></div>
          </div>
          <div class="slideLabel" id="thumb-label-current">---</div>
        </div>
        <div id="sidebarThumbs"></div>
      </div>
    </div>
    <div id="footer" class="presentationInfo card">
        <div id="smallTimer"><span id="currentTime">00:00:00</span></div>
        <div id="bigTimer">
          <span id="projectionTimer" title="Elapsed time">00:00:00</span>
          <button id="pauseTimerBtn" class="btn timerBtn" title="Pause/Resume timer" style="display:none;">
            <i class="fa fa-pause"></i>
          </button>
          <button id="resetTimerBtn" class="btn timerBtn" title="Reset timer" style="display:none;">
            <i class="fa fa-undo"></i>
          </button>
        </div>
        <div id="projectorUrlWrap" class="hidden">
          <a id="projectorUrlLabel" href="#" target="_blank" rel="noopener" title="Open the projector in your browser (with sound)"></a>
          <button id="copyProjectorUrlBtn" class="btn" skin="flat" title="Copy projector URL to clipboard">
            <i class="fa fa-copy"></i>
          </button>
        </div>
        <div id="currentSlideName">---</div>
        <div id="slidesCount">-/-</div>
    </div>
  </div>
  <dialog id="exitDialog">
    <h4 id="exitTitle" data-i18n="Are you sure about exiting impressPlayer?">Are you sure about exiting impressPlayer?</h4>
    <p id="exitText" data-i18n="Actually nothing bad could happen if you exit now, but still. <br />Do you really want to do it?">Actually nothing bad could happen if you exit now, but still. <br />Do you really want to do it?</p>
    <div id="windowControls" class="exitBtns btnRow">
      <button id="reallyQuit" class="danger btn">
        <div>
          <i class="fa fa-power-off"></i>
          <label id="exitAgree" class="btnLabel" data-i18n="Yes, get me out of here!">Yes, get me out of here!</label>
        </div>
      </button>
      <button id="doNotQuit" class="btn">
        <div>
          <i class="fa fa-ambulance"></i>
          <label id="exitDisagree" class="btnLabel" data-i18n="No, I haven't finished yet">No, I haven't finished yet</label>
        </div>
      </button>
    </div>
  </dialog>
  <script type="module" src="./controller-script.js"></script>
</body>
</html>
