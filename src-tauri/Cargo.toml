[package]
name = "impressplayer"
version = "0.9.1"
description = "Standalone impress.js presentations viewer and controller"
authors = ["Matej Moško"]
license = "CC0-1.0"
edition = "2021"

[lib]
name = "impressplayer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
dirs = "6"
base64 = "0.22"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
